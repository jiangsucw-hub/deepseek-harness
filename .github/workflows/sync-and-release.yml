name: Sync upstream and release

# Keeps this fork aligned with deepseek-ai/deepseek-harness and rebuilds the
# unsigned Desktop installers whenever upstream moves.
#
#   master              upstream plus the fork's own automation commit
#   release/linux-x64   master plus the Linux AppImage/deb packaging patches
#
# macOS packages build from master because they need no patches; Linux packages
# build from the release branch. A merge conflict while rebasing those patches
# fails this workflow on purpose: the patches need a human decision rather than a
# silent skip, and a failed run keeps the previous release untouched.

on:
  schedule:
    # 21:00 UTC = 05:00 Asia/Shanghai
    - cron: '0 21 * * *'
  workflow_dispatch:
    inputs:
      force:
        description: 'Publish even when upstream master has no new commits'
        type: boolean
        default: false

permissions:
  contents: write
  issues: write

concurrency:
  group: sync-and-release
  cancel-in-progress: false

env:
  UPSTREAM: deepseek-ai/deepseek-harness
  RELEASE_BRANCH: release/linux-x64

jobs:
  sync:
    name: Sync upstream and rebase the Linux patches
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    outputs:
      changed: ${{ steps.compare.outputs.changed }}
      sha: ${{ steps.compare.outputs.sha }}
      short: ${{ steps.compare.outputs.short }}
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: master
          fetch-depth: 0

      - name: Fetch upstream master
        run: |
          git remote add upstream "https://github.com/${UPSTREAM}.git"
          git fetch --no-tags upstream master

      - name: Merge upstream into master
        id: compare
        run: |
          set -euo pipefail
          upstream=$(git rev-parse upstream/master)
          echo "sha=${upstream}" >> "$GITHUB_OUTPUT"
          echo "short=$(git rev-parse --short=7 "${upstream}")" >> "$GITHUB_OUTPUT"
          if git merge-base --is-ancestor "${upstream}" HEAD; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "master already contains ${upstream}"
          else
            # master also carries the fork's own automation commit, so upstream arrives as a merge.
            git -c user.name='github-actions[bot]' \
                -c user.email='41898282+github-actions[bot]@users.noreply.github.com' \
                merge --no-edit "${upstream}"
            git push origin HEAD:refs/heads/master
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "master merged ${upstream}"
          fi

      - name: Rebase the Linux packaging patches onto master
        if: steps.compare.outputs.changed == 'true' || inputs.force
        run: |
          set -euo pipefail
          git fetch origin "${RELEASE_BRANCH}"
          git checkout -B "${RELEASE_BRANCH}" "origin/${RELEASE_BRANCH}"
          git -c user.name='github-actions[bot]' \
              -c user.email='41898282+github-actions[bot]@users.noreply.github.com' \
              merge --no-edit origin/master
          git push origin "${RELEASE_BRANCH}"

      - name: Read the product version
        id: version
        run: |
          set -euo pipefail
          master_version=$(git show origin/master:package.json | node -p "JSON.parse(require('node:fs').readFileSync(0, 'utf8')).version")
          branch_version=$(git show "origin/${RELEASE_BRANCH}:package.json" | node -p "JSON.parse(require('node:fs').readFileSync(0, 'utf8')).version")
          if [ "${master_version}" != "${branch_version}" ]; then
            echo "::error::master declares ${master_version} but ${RELEASE_BRANCH} declares ${branch_version}"
            exit 1
          fi
          echo "version=${master_version}" >> "$GITHUB_OUTPUT"
          echo "Product version: ${master_version}"

  mac:
    name: Package macOS x64
    needs: sync
    if: needs.sync.outputs.changed == 'true' || inputs.force
    runs-on: macos-15-intel
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: master
          clean: true

      - uses: pnpm/action-setup@v5.0.0
        with:
          dest: ${{ runner.temp }}/setup-pnpm

      - uses: actions/setup-node@v7.0.0
        with:
          node-version: '24'

      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile --reporter=append-only

      - name: Build the unsigned macOS x64 package
        run: pnpm run package:desktop:mac:x64:unsigned

      - name: Collect the installer
        id: artifact
        run: |
          set -euo pipefail
          dir=apps/desktop/.desktop-build/targets/mac-x64/unsigned-artifacts
          ls -lh "$dir"
          dmg=$(find "$dir" -maxdepth 1 -name '*.dmg' -type f | head -n 1)
          test -n "$dmg"
          echo "dmg=$dmg" >> "$GITHUB_OUTPUT"
          shasum -a 256 "$dmg" | tee "$RUNNER_TEMP/sha256.txt"

      - name: Publish the macOS release
        env:
          GH_TOKEN: ${{ github.token }}
          DMG: ${{ steps.artifact.outputs.dmg }}
          VERSION: ${{ needs.sync.outputs.version }}
          SHA: ${{ needs.sync.outputs.sha }}
          SHORT: ${{ needs.sync.outputs.short }}
        run: |
          set -euo pipefail
          tag="mac-x64-v${VERSION}-${SHORT}"
          name=$(basename "$DMG")
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release delete "$tag" --yes --cleanup-tag
          fi
          {
            echo "# DeepSeek Harness ${VERSION} · macOS Intel (x64)"
            echo
            echo "Automatic build of upstream \`${SHA}\` on \`macos-15-intel\`."
            echo "Ad-hoc signed, not notarized by Apple."
            echo
            echo "## Install"
            echo
            echo '```bash'
            echo "open ${name}"
            echo '```'
            echo
            echo "Drag **DeepSeek Harness** into *Applications*, then right-click → Open the first time."
            echo "If macOS still refuses: \`xattr -cr \"/Applications/DeepSeek Harness.app\"\`."
            echo
            echo "## Checksum"
            echo
            echo '```'
            cat "$RUNNER_TEMP/sha256.txt"
            echo '```'
          } > "$RUNNER_TEMP/notes.md"
          gh release create "$tag" "$DMG" \
            --title "DeepSeek Harness ${VERSION} (macOS Intel x64)" \
            --notes-file "$RUNNER_TEMP/notes.md" \
            --target "$SHA"

  linux:
    name: Package Linux x64
    needs: sync
    if: needs.sync.outputs.changed == 'true' || inputs.force
    runs-on: ubuntu-24.04
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: release/linux-x64
          clean: true

      - uses: pnpm/action-setup@v5.0.0
        with:
          dest: ${{ runner.temp }}/setup-pnpm

      - uses: actions/setup-node@v7.0.0
        with:
          node-version: '24'

      - name: Install Electron runtime libraries
        run: |
          sudo apt-get update
          for pkg in libgtk-3-0t64 libgtk-3-0 libnss3 libasound2t64 libasound2 \
                     libgbm1 libxss1 libxtst6 libatk-bridge2.0-0t64 libatk-bridge2.0-0 \
                     libcups2t64 libcups2 libdrm2 libxkbcommon0 libxcomposite1 \
                     libxdamage1 libxrandr2 libpango-1.0-0 libcairo2 xvfb; do
            sudo apt-get install -y --no-install-recommends "$pkg" || true
          done

      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile --reporter=append-only

      - name: Build the unsigned Linux x64 packages
        run: pnpm run package:desktop:linux:x64:unsigned

      - name: Collect the installers
        id: artifact
        run: |
          set -euo pipefail
          dir=apps/desktop/.desktop-build/targets/linux-x64/unsigned-artifacts
          ls -lh "$dir"
          appimage=$(find "$dir" -maxdepth 1 -name '*.AppImage' -type f | head -n 1)
          deb=$(find "$dir" -maxdepth 1 -name '*.deb' -type f | head -n 1)
          if [ -z "$appimage" ] || [ -z "$deb" ]; then
            echo "::error::Expected both an AppImage and a .deb in $dir"
            exit 1
          fi
          echo "appimage=$appimage" >> "$GITHUB_OUTPUT"
          echo "deb=$deb" >> "$GITHUB_OUTPUT"
          sha256sum "$appimage" "$deb" | tee "$RUNNER_TEMP/sha256.txt"

      - name: Publish the Linux release
        env:
          GH_TOKEN: ${{ github.token }}
          APPIMAGE: ${{ steps.artifact.outputs.appimage }}
          DEB: ${{ steps.artifact.outputs.deb }}
          VERSION: ${{ needs.sync.outputs.version }}
          SHA: ${{ needs.sync.outputs.sha }}
          SHORT: ${{ needs.sync.outputs.short }}
        run: |
          set -euo pipefail
          tag="linux-x64-v${VERSION}-${SHORT}"
          appimage_name=$(basename "$APPIMAGE")
          deb_name=$(basename "$DEB")
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release delete "$tag" --yes --cleanup-tag
          fi
          {
            echo "# DeepSeek Harness ${VERSION} · Linux x86_64"
            echo
            echo "Automatic build of upstream \`${SHA}\` on \`ubuntu-24.04\`."
            echo "The Electron payload is unsigned."
            echo
            echo "## Install as a .deb"
            echo
            echo '```bash'
            echo "sudo apt-get install -y ./${deb_name}"
            echo "deepseek-harness"
            echo '```'
            echo
            echo "Remove it with \`sudo apt-get remove deepseek-harness\`."
            echo
            echo "## Run the AppImage without installing"
            echo
            echo '```bash'
            echo "chmod +x ${appimage_name}"
            echo "./${appimage_name}"
            echo '```'
            echo
            echo "If your desktop refuses to launch the AppImage: \`sudo apt-get install -y libfuse2t64\`."
            echo
            echo "## Known limitation"
            echo
            echo "Office document conversion (DOCX/XLSX/PPTX to PDF) is not available in this Linux"
            echo "build: upstream publishes no native LibreOfficeKit engine for Linux, and the archived"
            echo "runtime cannot fall back to the bundled WASM engine. The same conversion passes in the"
            echo "unpacked runtime, so the rest of the application is unaffected."
            echo
            echo "## Checksums"
            echo
            echo '```'
            cat "$RUNNER_TEMP/sha256.txt"
            echo '```'
          } > "$RUNNER_TEMP/notes.md"
          gh release create "$tag" "$APPIMAGE" "$DEB" \
            --title "DeepSeek Harness ${VERSION} (Linux x64: AppImage + deb)" \
            --notes-file "$RUNNER_TEMP/notes.md" \
            --target release/linux-x64

  report:
    name: Report a failed run
    needs: [sync, mac, linux]
    if: failure()
    runs-on: ubuntu-24.04
    permissions:
      issues: write
      actions: read
    steps:
      - name: Open or refresh the failure issue
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          WORKFLOW: ${{ github.workflow }}
        run: |
          set -euo pipefail
          title="Automated upstream sync or packaging failed"
          body=$(printf 'The scheduled pipeline failed.\n\nRun: %s\n\nA merge conflict usually means upstream changed the Desktop packaging files and `release/linux-x64` needs the patches reapplied by hand.\n' "$RUN_URL")
          number=$(gh issue list --repo "$GITHUB_REPOSITORY" --state open \
            --search "in:title \"${title}\"" --json number --jq '.[0].number // empty')
          if [ -n "$number" ]; then
            gh issue comment "$number" --repo "$GITHUB_REPOSITORY" --body "$body"
          else
            gh issue create --repo "$GITHUB_REPOSITORY" --title "$title" --body "$body"
          fi
