name: Build Linux (x64) AppImage

# Builds the Desktop AppImage for Ubuntu on GitHub's Linux runner and publishes it
# to this repository's Releases.
#
# Upstream ships this target only as dead configuration: apps/desktop/scripts/
# package-target.ts rejects linux-x64, prepare-runtime.ts / prepare-dsh.ts hard-code
# the macOS Electron.app path, and the packaged-runtime smoke test only knows the
# mac and win layouts. This branch carries the missing plumbing (target table,
# Electron executable lookup, Linux launcher, AppImage smoke paths) so the existing
# unsigned packaging entry point can produce a runnable Intel/AMD64 AppImage.

on:
  push:
    branches: [ci/linux-x64]
  workflow_dispatch:

permissions:
  contents: write

env:
  DSH_TELEMETRY_DISABLED: '1'

concurrency:
  group: linux-x64-${{ github.ref }}
  cancel-in-progress: false

jobs:
  package:
    name: Package Linux x64
    runs-on: ubuntu-24.04
    timeout-minutes: 300
    steps:
      - name: Report the build host
        run: |
          uname -a
          . /etc/os-release && echo "$PRETTY_NAME"
          node --version
          df -h /

      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
          clean: true

      - uses: pnpm/action-setup@v5.0.0
        with:
          dest: ${{ runner.temp }}/setup-pnpm

      - uses: actions/setup-node@v7.0.0
        with:
          node-version: '24'
          check-latest: false

      # Electron is executed as Node during runtime preparation and the packaged
      # smoke test, so its shared-library dependencies must exist even headless.
      - name: Install Electron runtime libraries
        run: |
          sudo apt-get update
          for pkg in libgtk-3-0t64 libgtk-3-0 libnss3 libasound2t64 libasound2 \
                     libgbm1 libxss1 libxtst6 libatk-bridge2.0-0t64 libatk-bridge2.0-0 \
                     libcups2t64 libcups2 libdrm2 libxkbcommon0 libxcomposite1 \
                     libxdamage1 libxrandr2 libpango-1.0-0 libcairo2 xvfb; do
            sudo apt-get install -y --no-install-recommends "$pkg" || true
          done

      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile --reporter=append-only

      - name: Build the unsigned Linux x64 package
        run: pnpm run package:desktop:linux:x64:unsigned

      - name: Collect the AppImage
        id: artifact
        run: |
          set -euo pipefail
          dir=apps/desktop/.desktop-build/targets/linux-x64/unsigned-artifacts
          ls -lh "$dir"
          appimage=$(find "$dir" -maxdepth 1 -name '*.AppImage' -type f | head -n 1)
          if [ -z "$appimage" ]; then
            echo "::error::No AppImage was produced in $dir"
            exit 1
          fi
          echo "appimage=$appimage" >> "$GITHUB_OUTPUT"
          sha256sum "$appimage" | tee "$RUNNER_TEMP/sha256.txt"

      - name: Publish the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          APPIMAGE: ${{ steps.artifact.outputs.appimage }}
        run: |
          set -euo pipefail
          version=$(node -p "require('./package.json').version")
          tag="linux-x64-v${version}"
          commit=$(git rev-parse HEAD)
          name=$(basename "$APPIMAGE")
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release delete "$tag" --yes --cleanup-tag
          fi
          {
            echo "# DeepSeek Harness ${version} · Linux x86_64 AppImage"
            echo
            echo "Ubuntu / x86_64 AppImage built by GitHub Actions on \`ubuntu-24.04\` from \`${commit}\`."
            echo "The Electron payload is unsigned, and the AppImage runs without installation."
            echo
            echo "## Run"
            echo
            echo '```bash'
            echo "chmod +x ${name}"
            echo "./${name}"
            echo '```'
            echo
            echo "If your desktop refuses to launch it, install the FUSE compatibility layer once:"
            echo
            echo '```bash'
            echo "sudo apt-get install -y libfuse2t64"
            echo '```'
            echo
            echo "## Checksums"
            echo
            echo '```'
            cat "$RUNNER_TEMP/sha256.txt"
            echo '```'
          } > "$RUNNER_TEMP/notes.md"
          gh release create "$tag" "$APPIMAGE" \
            --title "DeepSeek Harness ${version} (Linux x64 AppImage)" \
            --notes-file "$RUNNER_TEMP/notes.md" \
            --target "$commit"

      - name: Retain the AppImage as a workflow artifact
        if: always()
        uses: actions/upload-artifact@v7.0.1
        with:
          name: deepseek-harness-linux-x64
          path: apps/desktop/.desktop-build/targets/linux-x64/unsigned-artifacts/*.AppImage
          if-no-files-found: warn
          retention-days: 14
